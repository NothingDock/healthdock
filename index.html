<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE">
<title>HealthDock</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HealthDock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --line: rgba(31,42,51,.09);
  --line-strong: rgba(31,42,51,.16);
  --muted-bg: rgba(31,42,51,.05);
  --danger: #B5443A;
  --warn: #9A6A00;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(31,42,51,.04), 0 2px 10px -4px rgba(31,42,51,.08);
  --nav-h: 62px;
  --header-h: 52px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; }
.tnum { font-variant-numeric: tabular-nums; }

/* ヘッダー */
.header {
  position: sticky; top: 0; z-index: 20; height: calc(var(--header-h) + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 16px 0; display: flex; align-items: center; justify-content: space-between;
  background: rgba(246,243,238,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: .04em; font-size: 17px; }
.brand img { width: 26px; height: 26px; border-radius: 7px; }
.sync { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft); }
.icon-btn:active { background: var(--muted-bg); }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.banner { margin: 10px 16px 0; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
.banner.offline { background: #FFF4D6; color: #6B4E00; border: 1px solid #F0DCA0; }
.banner.error { background: #FBE9E7; color: #8A2E25; border: 1px solid #F0C4BE; }
.banner .act { margin-left: 6px; text-decoration: underline; font-weight: 700; }

main { max-width: 720px; margin: 0 auto; padding: 12px 16px 24px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); }
.section-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 18px 2px 8px; }

/* 下部ナビ */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(255,255,255,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--ink-soft); }
.nav button svg { width: 23px; height: 23px; }
.nav button.active { color: var(--ink); font-weight: 700; }
.nav button.active .pill { background: var(--muted-bg); }
.nav .pill { padding: 3px 16px; border-radius: 14px; display: inline-flex; }

/* 日付ナビ */
.datebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.datebar .arrow { width: 40px; height: 40px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; }
.datebar .arrow:disabled { opacity: .35; cursor: default; }
.datebar .center { position: relative; flex: 1; text-align: center; }
.datebar .d { font-size: 18px; font-weight: 700; }
.datebar .rel { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--ink); color: #fff; vertical-align: 2px; }
.datebar .rel.past { background: var(--muted-bg); color: var(--ink-soft); }
.datebar input[type=date] { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.today-link { display: block; margin: -4px auto 10px; font-size: 12px; color: var(--ink-soft); text-decoration: underline; }

/* 記録タブ：左右 2 カラム */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 299px) { .cols { grid-template-columns: 1fr; } }
.col { border-radius: var(--radius); overflow: hidden; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.col-head { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 6px; color: #fff; font-weight: 700; font-size: 16px; }
.col.kenta .col-head { background: var(--kenta); }
.col.saori .col-head { background: var(--saori); }
.col-body { padding: 12px 10px 12px; display: flex; flex-direction: column; gap: 14px; }
.col.kenta .col-body { background: linear-gradient(var(--kenta-soft), #fff 90px); }
.col.saori .col-body { background: linear-gradient(var(--saori-soft), #fff 90px); }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin: 0 0 5px 2px; }
.numbox { display: flex; align-items: baseline; gap: 4px; border-radius: 10px; padding: 8px 10px; border: 1.5px solid; }
.col.kenta .numbox { border-color: var(--kenta-border); background: var(--kenta-field); }
.col.saori .numbox { border-color: var(--saori-border); background: var(--saori-field); }
.col.kenta .numbox:focus-within { border-color: var(--kenta); }
.col.saori .numbox:focus-within { border-color: var(--saori); }
.numbox input { border: none; outline: none; background: transparent; width: 100%; min-width: 0; font-size: 22px; font-weight: 700; padding: 0; font-variant-numeric: tabular-nums; }
.numbox input::placeholder { color: rgba(31,42,51,.25); font-weight: 500; }
.numbox .u { font-size: 13px; color: var(--ink-soft); flex-shrink: 0; }
.field .warn { font-size: 11px; color: var(--warn); margin: 4px 2px 0; line-height: 1.4; }
.sleep-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.sleep-grid button { height: 38px; border-radius: 9px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; border: 1.5px solid; }
.col.kenta .sleep-grid button { border-color: var(--kenta-border); background: var(--kenta-field); color: var(--kenta); }
.col.saori .sleep-grid button { border-color: var(--saori-border); background: var(--saori-field); color: var(--saori); }
.col.kenta .sleep-grid button.on { background: var(--kenta); border-color: var(--kenta); color: #fff; }
.col.saori .sleep-grid button.on { background: var(--saori); border-color: var(--saori); color: #fff; }
.status { font-size: 11px; font-weight: 500; background: rgba(255,255,255,.22); padding: 2px 7px; border-radius: 9px; white-space: nowrap; }
.status:empty { display: none; }
.status.error { background: #fff; color: var(--danger); font-weight: 700; }
.status button { text-decoration: underline; font-weight: 700; }
.savebar { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 15px; }
.btn-dark { background: var(--ink); color: #fff; }
.btn-dark:disabled { opacity: .4; cursor: default; }
.btn-light { background: var(--card); border: 1px solid var(--line-strong); }
.savebar .btn { flex: 1; }
.record-foot { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.foot-card { width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); text-align: left; background: var(--card); border: 1.5px solid var(--line-strong); box-shadow: var(--shadow); }
.foot-card:disabled { cursor: default; }
.foot-card .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.foot-card .main { font-size: 16px; font-weight: 700; }
.foot-card .sub { font-size: 12px; color: var(--ink-soft); }
.foot-card .go { font-size: 22px; color: var(--ink-soft); line-height: 1; }
.box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid currentColor; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; opacity: .55; }
.aya-card .main b { color: var(--aya); }
.aya-card.done .main b { color: var(--aya-done); }
.aya-card.done .box, .towel-card.on .box { background: var(--aya-done); border-color: var(--aya-done); color: #fff; opacity: 1; }
.towel-card { background: var(--towel-normal-bg); border-color: var(--towel-normal-border); color: var(--towel-normal-ink); }
.towel-card.warn { background: var(--towel-warn-bg); border-color: var(--towel-warn-border); color: var(--towel-warn-ink); }
.towel-card.alert { background: var(--towel-alert-bg); border-color: var(--towel-alert-border); color: var(--towel-alert-ink); }
.towel-card.warn .sub, .towel-card.alert .sub { color: inherit; opacity: .8; }
.towel-card.busy { opacity: .6; }
.rate-line { font-size: 12px; color: var(--ink-soft); text-align: right; }

/* 月間カレンダー（タオルを交換した日） */
.cal { padding: 14px 12px 12px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 10px; }
.cal-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.cal-nav { display: flex; align-items: center; gap: 4px; }
.cal-nav .m { font-size: 15px; font-weight: 700; min-width: 92px; text-align: center; }
.cal-nav button { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-soft); }
.cal-nav button:active { background: var(--muted-bg); }
.cal-nav button:disabled { opacity: .3; cursor: default; }
.cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-dow div { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-soft); padding-bottom: 6px; }
.cal-dow div:first-child { color: #B5443A; }
.cal-dow div:last-child { color: #2F6FB0; }
.cal-grid { row-gap: 4px; }
.cal-day { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border-radius: 10px; }
.cal-day .n { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cal-day .c { font-size: 9px; line-height: 1; height: 9px; font-weight: 700; color: var(--towel-mark); }
.cal-day:disabled { cursor: default; }
.cal-day.future .n { color: rgba(31,42,51,.3); }
.cal-day.swap .n { background: var(--towel-mark); color: #fff; font-weight: 700; }
.cal-day.today .n { box-shadow: 0 0 0 2px var(--ink); }
.cal-day.today.swap .n { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.cal-day.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 11px; color: var(--ink-soft); }
.cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
.cal-legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.cal-legend i.sel { border-radius: 4px; box-shadow: inset 0 0 0 2px var(--ink); }

/* グラフ */
.seg { display: inline-flex; background: var(--muted-bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { font-size: 13px; font-weight: 500; color: var(--ink-soft); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
.seg button.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(31,42,51,.1); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.chart-card { padding: 12px 10px 8px; position: relative; }
.legend { display: flex; gap: 14px; font-size: 12px; font-weight: 700; padding: 0 4px 6px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend .goal i { height: 0; border-top: 2px dashed var(--ink-soft); }
.chart { position: relative; touch-action: pan-y; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .axis { font-size: 10px; fill: var(--ink-soft); font-family: var(--font); }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; line-height: 1.5; padding: 6px 9px; border-radius: 8px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.tip .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.chart-empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 50px 0; }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.sum-card { border-radius: var(--radius); padding: 12px; border: 1px solid; }
.sum-card.kenta { background: var(--kenta-soft); border-color: var(--kenta-border); }
.sum-card.saori { background: var(--saori-soft); border-color: var(--saori-border); }
.sum-card h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.sum-card.kenta h3 { color: var(--kenta); }
.sum-card.saori h3 { color: var(--saori); }
.sum-card .big { font-size: 24px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.sum-card .big small { font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-left: 2px; }
.sum-card dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; font-size: 12px; }
.sum-card dt { color: var(--ink-soft); }
.sum-card dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.goal-set { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
.goal-set select { border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 6px; background: #fff; }
@media (max-width: 340px) { .sum { grid-template-columns: 1fr; } }
.wlist { margin-top: 12px; display: flex; flex-direction: column; overflow: hidden; min-height: 260px; }
.wl-head, .wl-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; padding: 0 14px; align-items: center; }
.wl-head { height: 40px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--ink-soft); border-bottom: 1px solid var(--line-strong); }
.wl-head span:not(:first-child), .wl-row span:not(:first-child) { text-align: right; }
.wl-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.wl-row { height: 42px; font-size: 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.wl-row .none { color: var(--ink-soft); }
.wl-more { display: block; width: 100%; padding: 12px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.wl-empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 40px 0; }

/* AYAトレ */
.aya-hero { padding: 20px 18px 18px; text-align: center; }
.aya-hero .label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.aya-hero .day { font-size: 64px; font-weight: 700; line-height: 1.05; color: var(--aya); letter-spacing: .01em; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
.aya-hero .day small { font-size: 26px; margin-right: 2px; }
.aya-hero .day.done { color: var(--aya-done); }
.aya-hero .sub { font-size: 14px; color: var(--ink-soft); }
.aya-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.aya-actions .btn { width: 100%; height: 50px; font-size: 16px; }
.btn-aya { background: var(--aya); color: #fff; }
.btn-check { background: var(--aya-done); color: #fff; }
.btn-check:disabled, .btn-aya[aria-disabled=true] { opacity: .45; cursor: default; }
.link-form { display: flex; gap: 8px; margin-top: 10px; }
.link-form input { flex: 1; min-width: 0; height: 44px; border-radius: 10px; border: 1.5px solid var(--line-strong); padding: 0 10px; font-size: 14px; background: #fff; }
.link-form input:focus { outline: none; border-color: var(--aya); }
.link-form .btn { height: 44px; padding: 0 14px; font-size: 14px; }
.hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; text-align: left; }
.hint.err { color: var(--danger); }
details.next-link { margin-top: 14px; text-align: left; font-size: 13px; }
details.next-link summary { color: var(--ink-soft); cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
.stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; margin-left: 1px; color: var(--ink-soft); font-weight: 500; }
.stat .k { font-size: 11px; color: var(--ink-soft); }
.aya-list { list-style: none; margin: 0; padding: 4px 0; }
.aya-list li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.aya-list li:last-child { border-bottom: none; }
.aya-list li.current { background: rgba(47,111,176,.07); }
.mark { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid var(--line-strong); }
.mark.done { background: var(--aya-done); border-color: var(--aya-done); color: #fff; }
.current .mark { border-color: var(--aya); }
.aya-list .dn { font-weight: 700; color: var(--aya); width: 62px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.aya-list .dd { flex: 1; font-size: 13px; color: var(--ink-soft); min-width: 0; }
.aya-list .current .dd { color: var(--aya); font-weight: 700; }
.aya-list .vid { font-size: 13px; font-weight: 700; color: var(--aya); text-decoration: none; padding: 4px 8px; border-radius: 8px; background: rgba(47,111,176,.08); white-space: nowrap; }
.aya-list .vid.none { background: none; color: var(--ink-soft); font-weight: 400; }
.undo { font-size: 12px; color: var(--danger); text-decoration: underline; white-space: nowrap; }
.loading { text-align: center; color: var(--ink-soft); padding: 40px 0; font-size: 14px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); z-index: 40; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18); max-width: calc(100% - 32px); }

/* グラフ */
.seg { display: inline-flex; background: var(--muted-bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { font-size: 13px; font-weight: 500; color: var(--ink-soft); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
.seg button.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(31,42,51,.1); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.chart-card { padding: 12px 10px 8px; position: relative; }
.legend { display: flex; gap: 14px; font-size: 12px; font-weight: 700; padding: 0 4px 6px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend .goal i { height: 0; border-top: 2px dashed var(--ink-soft); }
.chart { position: relative; touch-action: pan-y; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .axis { font-size: 10px; fill: var(--ink-soft); font-family: var(--font); }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; line-height: 1.5; padding: 6px 9px; border-radius: 8px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.tip .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.chart-empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 50px 0; }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.sum-card { border-radius: var(--radius); padding: 12px; border: 1px solid; }
.sum-card.kenta { background: var(--kenta-soft); border-color: var(--kenta-border); }
.sum-card.saori { background: var(--saori-soft); border-color: var(--saori-border); }
.sum-card h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.sum-card.kenta h3 { color: var(--kenta); }
.sum-card.saori h3 { color: var(--saori); }
.sum-card .big { font-size: 24px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.sum-card .big small { font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-left: 2px; }
.sum-card dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; font-size: 12px; }
.sum-card dt { color: var(--ink-soft); }
.sum-card dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.goal-set { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); }
.goal-set select { border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 6px; background: #fff; }
@media (max-width: 340px) { .sum { grid-template-columns: 1fr; } }
.wlist { margin-top: 12px; display: flex; flex-direction: column; overflow: hidden; min-height: 260px; }
.wl-head, .wl-row { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; padding: 0 14px; align-items: center; }
.wl-head { height: 40px; flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--ink-soft); border-bottom: 1px solid var(--line-strong); }
.wl-head span:not(:first-child), .wl-row span:not(:first-child) { text-align: right; }
.wl-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.wl-row { height: 42px; font-size: 14px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.wl-row .none { color: var(--ink-soft); }
.wl-more { display: block; width: 100%; padding: 12px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.wl-empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 40px 0; }

/* AYAトレ */
.aya-hero { padding: 20px 18px 18px; text-align: center; }
.aya-hero .label { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.aya-hero .day { font-size: 64px; font-weight: 700; line-height: 1.05; color: var(--aya); letter-spacing: .01em; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
.aya-hero .day small { font-size: 26px; margin-right: 2px; }
.aya-hero .day.done { color: var(--aya-done); }
.aya-hero .sub { font-size: 14px; color: var(--ink-soft); }
.aya-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.aya-actions .btn { width: 100%; height: 50px; font-size: 16px; }
.btn-aya { background: var(--aya); color: #fff; }
.btn-check { background: var(--aya-done); color: #fff; }
.btn-check:disabled, .btn-aya[aria-disabled=true] { opacity: .45; cursor: default; }
.link-form { display: flex; gap: 8px; margin-top: 10px; }
.link-form input { flex: 1; min-width: 0; height: 44px; border-radius: 10px; border: 1.5px solid var(--line-strong); padding: 0 10px; font-size: 14px; background: #fff; }
.link-form input:focus { outline: none; border-color: var(--aya); }
.link-form .btn { height: 44px; padding: 0 14px; font-size: 14px; }
.hint { font-size: 12px; color: var(--ink-soft); margin-top: 6px; text-align: left; }
.hint.err { color: var(--danger); }
details.next-link { margin-top: 14px; text-align: left; font-size: 13px; }
details.next-link summary { color: var(--ink-soft); cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; }
.stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 12px; margin-left: 1px; color: var(--ink-soft); font-weight: 500; }
.stat .k { font-size: 11px; color: var(--ink-soft); }
.aya-list { list-style: none; margin: 0; padding: 4px 0; }
.aya-list li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.aya-list li:last-child { border-bottom: none; }
.aya-list li.current { background: rgba(47,111,176,.07); }
.mark { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid var(--line-strong); }
.mark.done { background: var(--aya-done); border-color: var(--aya-done); color: #fff; }
.current .mark { border-color: var(--aya); }
.aya-list .dn { font-weight: 700; color: var(--aya); width: 62px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.aya-list .dd { flex: 1; font-size: 13px; color: var(--ink-soft); min-width: 0; }
.aya-list .current .dd { color: var(--aya); font-weight: 700; }
.aya-list .vid { font-size: 13px; font-weight: 700; color: var(--aya); text-decoration: none; padding: 4px 8px; border-radius: 8px; background: rgba(47,111,176,.08); white-space: nowrap; }
.aya-list .vid.none { background: none; color: var(--ink-soft); font-weight: 400; }
.undo { font-size: 12px; color: var(--danger); text-decoration: underline; white-space: nowrap; }
.loading { text-align: center; color: var(--ink-soft); padding: 40px 0; font-size: 14px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); z-index: 40; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18); max-width: calc(100% - 32px); }

.login { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 24px; }
.login-card { width: 100%; max-width: 340px; background: var(--card); border-radius: 22px; padding: 28px 20px; text-align: center; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.login-card h1 { margin: 4px 0 0; font-size: 22px; font-weight: 700; }
.login-card p { margin: 0 0 8px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
</style>
</head>
<body>
<header class="header">
  <div class="brand"><img src="icons/icon.svg" alt="">HealthDock</div>
  <div class="sync"><span id="syncText" class="tnum"></span>
    <button class="icon-btn" id="refreshBtn" aria-label="再読み込み" title="再読み込み">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>
<div id="banners"></div>
<main id="main"><div class="loading">読み込み中…</div></main>
<nav class="nav" id="nav" aria-label="メイン">
  <button data-tab="record"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>記録</button>
  <button data-tab="weight"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg></span>体重</button>
  <button data-tab="aya"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></svg></span>AYAトレ</button>
  <button data-tab="sleep"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></span>睡眠</button>
</nav>
<div id="toastRoot"></div>

<script>
'use strict';
// ---------------------------------------------------------------------------
// 共通
// ---------------------------------------------------------------------------
const T = window.HD_THEME;
const PEOPLE = ['kenta', 'saori'];
const LS = 'healthdock_';
const RECENT_DAYS = 90;
const LIMITS = { weight: [20, 300], fat: [3, 70] };
const DOW = ['日', '月', '火', '水', '木', '金', '土'];

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const fmtMD = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const fmtLong = s => { const d = parseYmd(s); return `${d.getMonth() + 1}月${d.getDate()}日(${DOW[d.getDay()]})`; };
const fmtMDW = s => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };
const sleepNum = v => (v ? parseFloat(String(v).replace(/h$/i, '')) : null);
const fix1 = n => (n == null || !Number.isFinite(n) ? '–' : (Math.round(n * 10) / 10).toFixed(1));

function lsGet(k, d) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch { /* noop */ } }

const S = {
  tab: 'record',
  config: lsGet('config', { sleepOptions: ['5h', '5.5h', '6h', '6.5h', '7h', '7.5h', '8h', '8.5h', '9h'], ayaStartDate: '2026-10-18' }),
  logs: new Map(),
  allLoaded: false,
  loadedFrom: null,
  aya: null,
  towel: { date: null, last: undefined, loading: false, failedFor: null }, // last = 表示日以前で最も新しい交換日
  date: today(),
  online: navigator.onLine,
  error: null,
  syncedAt: null,
  loading: false,
  draft: null,          // 記録タブの入力中の値 { kenta: { weight, fat, sleep }, saori: {...} }
  dirty: { kenta: new Set(), saori: new Set() },
  save: { kenta: 'idle', saori: 'idle' },
  saveErr: { kenta: '', saori: '' },
  period: lsGet('period', 30),
  metric: 'weight',
  sleepGoal: lsGet('sleepGoal', 7),
};

// 直前に取得したデータ（オフライン表示用）
(function restoreCache() {
  const c = lsGet('cache', null);
  if (!c) return;
  for (const r of c.logs || []) S.logs.set(r.date, r);
  S.aya = c.aya || null;
  if (c.towel && c.towel.date) S.towel = { ...S.towel, date: c.towel.date, last: c.towel.last };
  S.syncedAt = c.syncedAt || null;
})();
function saveCache() {
  const from = addDays(today(), -RECENT_DAYS);
  const towel = S.towel.date ? { date: S.towel.date, last: S.towel.last } : null;
  lsSet('cache', { logs: [...S.logs.values()].filter(r => r.date >= from), aya: S.aya, towel, syncedAt: S.syncedAt });
}

// 画面側のコードは従来の「/api/...」形式のまま呼ぶ。ここで Apps Script の窓口への依頼に変換する。
function toAction(method, url, body) {
  const u = new URL(url, 'http://local');
  const p = u.pathname, q = u.searchParams;
  let m;
  if (p === '/api/config') return ['config', { refresh: q.get('refresh') === '1' }];
  if (p === '/api/logs') return ['logs', q.get('all') === '1' ? { all: true } : { from: q.get('from'), to: q.get('to') }];
  if ((m = p.match(/^\/api\/logs\/(\d{4}-\d{2}-\d{2})$/))) return ['saveLog', { date: m[1], data: body }];
  if (p === '/api/towel') return ['towel', { date: q.get('date') }];
  if (p === '/api/aya' && method === 'GET') return ['aya', { refresh: q.get('refresh') === '1' }];
  if (p === '/api/aya/check') return ['ayaCheck', { date: body.date }];
  if (p === '/api/aya/uncheck') return ['ayaUncheck', { date: body.date }];
  if (p === '/api/aya/import') return ['ayaImport', { dates: body.dates }];
  if ((m = p.match(/^\/api\/aya\/links\/(\d{1,4})$/))) return ['ayaLink', { day: Number(m[1]), url: body.url }];
  throw new Error('不明な操作です。');
}

async function api(method, url, body) {
  const [action, extra] = toAction(method, url, body);
  if (!navigator.onLine) throw new Error('電波がありません。つながってからもう一度お試しください。');
  let token;
  try {
    token = await HDAuth.getToken();
  } catch (e) {
    if (e instanceof HDAuth.NeedLogin) { showLogin(); throw new Error('ログインが必要です。'); }
    throw e;
  }
  let res;
  try {
    res = await fetch(HDAuth.config().apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ token, action }, extra))
    });
  } catch (e) {
    console.error('[api]', action, e);
    throw new Error('サーバーに接続できません。ネットワーク接続を確認してください。');
  }
  const json = await res.json().catch(() => ({}));
  if (json.error === 'forbidden') { HDAuth.signOut(); showLogin('ログインし直してください。許可されていないアカウントでは使えません。'); throw new Error('ログインし直してください。'); }
  if (json.error) { console.error('[api]', action, json); throw new Error(json.message || `エラーが発生しました（${json.error}）`); }
  return json;
}

// ログイン画面（Google ログインが必要なとき、全面に出す）
function showLogin(message) {
  let el = $('#loginRoot');
  if (!el) { el = document.createElement('div'); el.id = 'loginRoot'; document.body.appendChild(el); }
  el.innerHTML = `<div class="login"><div class="login-card">
    <img src="icons/icon.svg" alt="" width="56" height="56">
    <h1>HealthDock</h1>
    <p>${esc(message || '使うには Google でログインしてください。')}</p>
    <div id="loginBtn"></div>
  </div></div>`;
  HDAuth.renderButton($('#loginBtn'));
}
HDAuth.onLogin(() => {
  const el = $('#loginRoot');
  if (el) el.remove();
  refresh({ force: true });
});

let toastTimer;
function toast(msg) {
  const root = $('#toastRoot');
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 2600);
}

// ---------------------------------------------------------------------------
// データ取得
// ---------------------------------------------------------------------------
function mergeLogs(records) { for (const r of records) S.logs.set(r.date, r); }

async function loadRecent() {
  const to = today();
  const from = addDays(to, -(RECENT_DAYS - 1));
  const { records, syncedAt } = await api('GET', `/api/logs?from=${from}&to=${to}`);
  // 範囲内は取り直した内容で置き換え（Notion 側で消された値も反映）
  for (const d of [...S.logs.keys()]) if (d >= from && d <= to) S.logs.delete(d);
  mergeLogs(records);
  S.loadedFrom = S.loadedFrom && S.loadedFrom < from ? S.loadedFrom : from;
  S.syncedAt = syncedAt;
}
async function loadAll() {
  const { records } = await api('GET', '/api/logs?all=1');
  S.logs.clear();
  mergeLogs(records);
  S.allLoaded = true;
}
async function loadDate(date) {
  const { records } = await api('GET', `/api/logs?from=${date}&to=${date}`);
  S.logs.delete(date);
  mergeLogs(records);
}
async function loadAya(refresh) {
  S.aya = await api('GET', `/api/aya${refresh ? '?refresh=1' : ''}`);
}
async function loadTowel(date) {
  S.towel.loading = true;
  try {
    const r = await api('GET', `/api/towel?date=${date}`);
    if (S.date === date) S.towel = { date, last: r.last, loading: false, failedFor: null };
  } catch (e) {
    S.towel.failedFor = date;
    throw e;
  } finally {
    S.towel.loading = false;
  }
}

async function refresh({ quiet, force } = {}) {
  if (S.loading) return;
  S.loading = true;
  $('#refreshBtn').classList.add('spin');
  try {
    const tasks = [loadRecent(), loadAya(force), loadTowel(S.date)];
    if (S.allLoaded) tasks.push(loadAll());
    if (!S.config.types || force) tasks.push(api('GET', `/api/config${force ? '?refresh=1' : ''}`).then(c => { S.config = c; lsSet('config', c); }));
    await Promise.all(tasks);
    if (!S.logs.has(S.date) && S.date < S.loadedFrom && !S.allLoaded) await loadDate(S.date);
    S.error = null;
    saveCache();
  } catch (e) {
    S.error = e.message;
  } finally {
    S.loading = false;
    $('#refreshBtn').classList.remove('spin');
    renderBanners();
    renderSync();
    if (S.tab === 'record') syncRecordFromData(); else render();
  }
}

function renderSync() {
  const t = S.syncedAt ? new Date(S.syncedAt) : null;
  $('#syncText').textContent = t ? `${pad(t.getHours())}:${pad(t.getMinutes())} 同期` : '';
}
function renderBanners() {
  const out = [];
  if (!S.online) out.push(`<div class="banner offline">オフラインです。前回取得したデータを表示しています。入力は保存できません。</div>`);
  else if (S.error) out.push(`<div class="banner error">${esc(S.error)}<button class="act" data-act="retry-load">再読み込み</button></div>`);
  $('#banners').innerHTML = out.join('');
}

// ---------------------------------------------------------------------------
// タブ
// ---------------------------------------------------------------------------
const TABS = ['record', 'weight', 'aya', 'sleep'];
function setTab(tab) {
  if (!TABS.includes(tab)) tab = 'record';
  if (S.tab === 'record' && tab !== 'record') flushSaves();
  S.tab = tab;
  if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
  for (const b of document.querySelectorAll('.nav button')) b.classList.toggle('active', b.dataset.tab === tab);
  render();
  window.scrollTo(0, 0);
}
function render() {
  const main = $('#main');
  if (S.tab === 'record') renderRecord(main);
  else if (S.tab === 'weight') renderWeight(main);
  else if (S.tab === 'aya') renderAya(main);
  else renderSleep(main);
}

// ---------------------------------------------------------------------------
// 記録タブ
// ---------------------------------------------------------------------------
function recordOf(date) { return S.logs.get(date) || null; }
function draftFrom(rec) {
  const d = {};
  for (const p of PEOPLE) {
    const v = rec ? rec[p] : {};
    d[p] = { weight: v.weight != null ? String(v.weight) : '', fat: v.fat != null ? String(v.fat) : '', sleep: v.sleep || null };
  }
  return d;
}
function parseNum(s) {
  const t = String(s || '').trim().replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/,/g, '.');
  if (!t) return null;
  const n = Number(t);
  return Number.isFinite(n) ? Math.round(n * 10) / 10 : NaN;
}
function fieldWarn(field, s) {
  const n = parseNum(s);
  if (n === null) return '';
  if (Number.isNaN(n)) return '数値で入力してください';
  const [lo, hi] = LIMITS[field];
  if (n < lo || n > hi) return `${lo}〜${hi} の範囲外です。正しければ「保存」を押してください`;
  return '';
}

function renderRecord(main) {
  if (!S.draft || S.draft._date !== S.date) {
    S.draft = draftFrom(recordOf(S.date));
    S.draft._date = S.date;
    for (const p of PEOPLE) { S.dirty[p].clear(); S.save[p] = 'idle'; }
  }
  const isToday = S.date === today();
  const rel = isToday ? '今日' : `${diffDays(S.date, today())}日前`;
  main.innerHTML = `
    <div class="datebar">
      <button class="arrow" data-act="prev-day" aria-label="前の日"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="center"><span class="d tnum">${fmtLong(S.date)}</span><span class="rel ${isToday ? '' : 'past'}">${rel}</span>
        <input type="date" id="datePick" value="${S.date}" max="${today()}" aria-label="日付を選ぶ"></div>
      <button class="arrow" data-act="next-day" aria-label="次の日" ${isToday ? 'disabled' : ''}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    ${isToday ? '' : '<button class="today-link" data-act="go-today">今日に戻る</button>'}
    <div class="cols">${PEOPLE.map(colHtml).join('')}</div>
    <div class="savebar"><button class="btn btn-dark" data-act="save-all" id="saveAll">保存</button></div>
    <div class="record-foot" id="recordFoot"></div>`;
  for (const p of PEOPLE) updateStatus(p);
  updateFoot();
}

function colHtml(p) {
  const d = S.draft[p];
  const name = T.people[p].name;
  const sleepBtns = S.config.sleepOptions.map(o =>
    `<button type="button" class="${d.sleep === o ? 'on' : ''}" data-act="sleep" data-p="${p}" data-v="${esc(o)}" aria-pressed="${d.sleep === o}">${esc(o)}</button>`).join('');
  return `
  <section class="col ${p}" aria-label="${name}">
    <div class="col-head"><span>${name}</span><span class="status" id="st-${p}"></span></div>
    <div class="col-body">
      <div class="field">
        <label for="w-${p}">体重</label>
        <div class="numbox"><input id="w-${p}" data-p="${p}" data-f="weight" inputmode="decimal" autocomplete="off" placeholder="--.-" value="${esc(d.weight)}"><span class="u">kg</span></div>
        <div class="warn" id="warn-${p}-weight">${esc(fieldWarn('weight', d.weight))}</div>
      </div>
      <div class="field">

        <div class="warn" id="warn-${p}-fat">${esc(fieldWarn('fat', d.fat))}</div>
      </div>

        <label>睡眠時間</label>
        <div class="sleep-grid" role="group" aria-label="${name}の睡眠時間">${sleepBtns}</div>
      </div>

}

function updateStatus(p) {
  const el = document.getElementById('st-' + p);
  if (!el) return;
  const st = S.save[p];
  el.className = 'status' + (st === 'error' ? ' error' : '');
  if (st === 'saving') el.textContent = '保存中…';
  else if (st === 'saved') el.textContent = '保存済み ✓';
  else if (st === 'dirty') el.textContent = '未保存';
  else if (st === 'warn') el.textContent = '確認してください';
  else if (st === 'offline') el.textContent = 'オフライン';
  else if (st === 'error') el.innerHTML = `失敗 <button data-act="retry-save" data-p="${p}">再試行</button>`;
  else el.textContent = '';
  if (st === 'error' && S.saveErr[p]) el.title = S.saveErr[p];
}

const CHECK_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';

function updateFoot() {
  const el = $('#recordFoot');

// ---------------------------------------------------------------------------
// タオル取り替え（夫婦共通・1 日 1 チェック）
// ---------------------------------------------------------------------------
let towelBusy = false;

// 表示日以前で最も新しい交換日（null = 記録なし、undefined = まだ分からない）
function towelLast(date) {
  const rec = recordOf(date);
  if (rec && rec.towel) return date;
  return S.towel.date === date ? S.towel.last : undefined;
}
// 交換日を 1 日目として数え、3 日目は注意・4 日目以降は警告。
// 「今日は交換日の目安（火・木・土）」などを足すときは、ここで level や文言を決める。
function towelStatus(date, last) {
  if (!last) return { n: null, level: 'normal' };
  const n = diffDays(last, date) + 1;
  return { n, level: n >= 4 ? 'alert' : n === 3 ? 'warn' : 'normal' };
}

function towelCardHtml() {
  const date = S.date;
  const rec = recordOf(date);
  const on = !!(rec && rec.towel);
  const last = towelLast(date);
  const { n, level } = towelStatus(date, last);
  const verb = level === 'normal' ? '取り替える' : '取り替えよう';
  const sub = last ? `最後の交換：${fmtMDW(last)}`
    : last === null ? 'まだ交換の記録がありません'
    : S.towel.failedFor === date ? '最後の交換日を読み込めませんでした' : '読み込み中…';
  return `
    <button class="foot-card towel-card ${level} ${on ? 'on' : ''} ${towelBusy ? 'busy' : ''}" data-act="towel" role="checkbox" aria-checked="${on}" ${towelBusy ? 'disabled' : ''}>
      <span class="box">${on ? CHECK_SVG : ''}</span>
      <span class="txt"><span class="main">タオルを${verb}：<b class="tnum">${n == null ? '—' : n}日目</b></span><span class="sub tnum">${sub}</span></span>
    </button>`;
}

async function toggleTowel() {
  if (towelBusy) return;
  if (!S.online) { toast('オフラインのため保存できません'); return; }
  const date = S.date;
  const rec = recordOf(date);
  const next = !(rec && rec.towel);
  towelBusy = true;
  updateFoot();
  try {
    const { record } = await api('PATCH', `/api/logs/${date}`, { towel: next });
    S.logs.set(record.date, record);
    if (next) S.towel = { date, last: date, loading: false, failedFor: null };
    else {
      // 取り消したら、それより前の交換日を取り直して日数を再計算
      S.towel = { date: null, last: undefined, loading: false, failedFor: null };
      await loadTowel(date).catch(e => console.error('[towel]', e));
    }
    saveCache();
  } catch (e) {
    toast(`タオル取り替えを保存できませんでした：${e.message}`);
  } finally {
    towelBusy = false;
    if (S.tab === 'record') updateFoot();
  }
}

// サーバーから新しいデータが来たとき、編集中でない欄だけ更新する
function syncRecordFromData() {
  if (S.tab !== 'record') return;
  if (!S.draft || S.draft._date !== S.date) return render();
  const rec = recordOf(S.date);
  const fresh = draftFrom(rec);
  for (const p of PEOPLE) {
    for (const f of ['weight', 'fat', 'sleep']) {
      if (S.dirty[p].has(f)) continue;
      const input = f === 'sleep' ? null : document.querySelector(`input[data-p="${p}"][data-f="${f}"]`);
      if (input && document.activeElement === input) continue;
      S.draft[p][f] = fresh[p][f];
      if (input) { input.value = fresh[p][f]; setWarn(p, f); }
    }
    for (const b of document.querySelectorAll(`.sleep-grid button[data-p="${p}"]`)) {
      const on = b.dataset.v === S.draft[p].sleep;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
    }
  }
  updateFoot();
}

function setWarn(p, f) {
  const el = document.getElementById(`warn-${p}-${f}`);
  if (el) el.textContent = fieldWarn(f, S.draft[p][f]);
}

// 保存（人ごとにデバウンス）
const saveTimers = {};
const inflight = { kenta: null, saori: null };
function scheduleSave(p, ms) {
  clearTimeout(saveTimers[p]);
  saveTimers[p] = setTimeout(() => saveNow(p, false), ms);
}
function flushSaves() {
  for (const p of PEOPLE) if (S.dirty[p].size) { clearTimeout(saveTimers[p]); saveNow(p, false); }
}

async function saveNow(p, force) {
  if (!S.dirty[p].size) return;
  if (!S.online) { S.save[p] = 'offline'; updateStatus(p); return; }
  if (inflight[p]) { await inflight[p].catch(() => {}); if (!S.dirty[p].size) return; }
  const date = S.draft._date;
  const payload = {};
  const held = [];   // 範囲外・数値でない欄は保存せず確認待ちにする（他の欄は保存する）
  for (const f of S.dirty[p]) {
    const raw = S.draft[p][f];
    if (f === 'sleep') { payload.sleep = raw || null; continue; }
    const n = parseNum(raw);
    if (Number.isNaN(n)) { held.push(f); continue; }
    if (n !== null && !force) {
      const [lo, hi] = LIMITS[f];
      if (n < lo || n > hi) { held.push(f); continue; }
    }
    payload[f] = n;
  }
  const fields = Object.keys(payload);
  if (!fields.length) { S.save[p] = 'warn'; updateStatus(p); return; }
  const sent = {};
  for (const f of fields) sent[f] = S.draft[p][f];
  S.save[p] = 'saving';
  updateStatus(p);
  const job = api('PATCH', `/api/logs/${date}`, { [p]: payload });
  inflight[p] = job;
  try {
    const { record } = await job;
    S.logs.set(record.date, record);
    saveCache();
    if (S.draft._date === date) {
      // 送信後に書き換えられていなければ未保存フラグを外す
      for (const f of fields) if (S.draft[p][f] === sent[f]) S.dirty[p].delete(f);
      const changed = [...S.dirty[p]].some(f => !held.includes(f));
      S.save[p] = changed ? 'dirty' : held.length ? 'warn' : 'saved';
      if (S.tab === 'record') { updateStatus(p); updateFoot(); }
      if (changed) scheduleSave(p, 300);
    }
  } catch (e) {
    S.saveErr[p] = e.message;
    if (S.draft._date === date) { S.save[p] = 'error'; updateStatus(p); }
    toast(`${T.people[p].name}の保存に失敗しました：${e.message}`);
  } finally {
    inflight[p] = null;
  }
}

          <span class="m tnum">${y}年${m}月</span>

// 直近 90 日より前の月を表示したときだけ、その月の記録を追加で取得する
function ensureMonth(ym) {
  const [y, m] = ym.split('-').map(Number);
  const from = `${ym}-01`;
  const to = `${ym}-${pad(new Date(y, m, 0).getDate())}`;
  if (S.allLoaded || !S.loadedFrom || from >= S.loadedFrom || monthsLoaded.has(ym) || !S.online) return;
  monthsLoaded.add(ym);
  api('GET', `/api/logs?from=${from}&to=${to}`)
    .then(({ records }) => { mergeLogs(records); if (S.tab === 'record') updateFoot(); })
    .catch(e => { monthsLoaded.delete(ym); toast(e.message); });
}

function shiftCalMonth(n) {
  const [y, m] = calMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  updateFoot();
}

async function changeDate(date) {
  if (date > today()) date = today();
  flushSaves();
  S.date = date;
  calMonth = date.slice(0, 7);
  S.draft = null;
  render();
  if (!S.allLoaded && (!S.loadedFrom || date < S.loadedFrom)) {
    try { await loadDate(date); S.draft = null; render(); }
    catch (e) { toast(e.message); }
  }
}

// ---------------------------------------------------------------------------
// グラフ（体重・睡眠で共通）
// ---------------------------------------------------------------------------
const charts = new Map();
let chartSeq = 0;

function periodDates(period) {
  const t = today();
  let from;
  if (period === 'all') {
    const ds = [...S.logs.values()].filter(r => hasAnyValue(r)).map(r => r.date).sort();
    from = ds[0] || addDays(t, -29);
  } else from = addDays(t, -(period - 1));
  const out = [];
  for (let d = from; d <= t; d = addDays(d, 1)) out.push(d);
  return out;
}
function hasAnyValue(r) { return PEOPLE.some(p => r[p].weight != null || r[p].fat != null || r[p].sleep); }

function niceStep(range, maxTicks) {
  const raw = range / maxTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * mag >= raw) return m * mag;
  return 10 * mag;
}

// model: { dates, series: [{ key, name, color, values: Map(date → number) }], unit, kind: 'line'|'bar', goal, fixedMin, fixedMax }
function chartHtml(model) {
  const id = 'c' + (++chartSeq);
  const W = 340, H = 210, L = 34, R = 8, Tp = 10, B = 24;
  const pw = W - L - R, ph = H - Tp - B;
  const n = model.dates.length;
  const all = [];
  for (const s of model.series) for (const d of model.dates) { const v = s.values.get(d); if (v != null) all.push(v); }
  if (!all.length) return `<div class="chart-empty">この期間の記録はまだありません</div>`;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (model.goal != null) { lo = Math.min(lo, model.goal); hi = Math.max(hi, model.goal); }
  if (model.fixedMin != null) lo = Math.min(lo, model.fixedMin);
  if (model.fixedMax != null) hi = Math.max(hi, model.fixedMax);
  if (hi - lo < 1) { lo -= 0.5; hi += 0.5; }
  const step = niceStep(hi - lo, 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  if (model.kind === 'bar' && model.fixedMin != null) lo = model.fixedMin;
  const y = v => Tp + ph - ((v - lo) / (hi - lo)) * ph;
  const x = i => model.kind === 'bar' ? L + pw * (i + 0.5) / n : (n === 1 ? L + pw / 2 : L + pw * i / (n - 1));
  const idx = new Map(model.dates.map((d, i) => [d, i]));
  let g = '';
  // 目盛り
  const dec = step < 1 ? 1 : 0;
  for (let v = lo; v <= hi + 1e-9; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(31,42,51,.08)"/>`;
    g += `<text class="axis" x="${L - 5}" y="${y(v) + 3}" text-anchor="end">${v.toFixed(dec)}</text>`;
  }
  const ticks = Math.min(n, 5);
  for (let k = 0; k < ticks; k++) {
    const i = ticks === 1 ? 0 : Math.round(k * (n - 1) / (ticks - 1));
    g += `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="${k === 0 && model.kind !== 'bar' ? 'start' : k === ticks - 1 && model.kind !== 'bar' ? 'end' : 'middle'}">${fmtMD(model.dates[i])}</text>`;
  }
  if (model.goal != null) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(model.goal)}" y2="${y(model.goal)}" stroke="#5E6A73" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    g += `<text class="axis" x="${W - R}" y="${y(model.goal) - 4}" text-anchor="end">目標 ${model.goal}${model.unit}</text>`;
  }
  // データ
  model.series.forEach((s, si) => {
    const pts = model.dates.filter(d => s.values.get(d) != null).map(d => [x(idx.get(d)), y(s.values.get(d))]);
    if (model.kind === 'bar') {
      const bw = Math.max(1.5, Math.min(14, pw / n * 0.36));
      const off = (si - (model.series.length - 1) / 2) * (bw + 1);
      for (const d of model.dates) {
        const v = s.values.get(d);
        if (v == null) continue;
        const top = y(v);
        g += `<rect x="${x(idx.get(d)) + off - bw / 2}" y="${top}" width="${bw}" height="${Math.max(0, Tp + ph - top)}" rx="${Math.min(3, bw / 2)}" fill="${s.color}"/>`;
      }
    } else {
      if (pts.length > 1) g += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('')}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
      const r = n <= 31 ? 3.2 : 2;
      for (const p of pts) g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="#fff" stroke="${s.color}" stroke-width="2"/>`;
    }
  });
  g += `<line id="${id}-guide" x1="0" x2="0" y1="${Tp}" y2="${Tp + ph}" stroke="rgba(31,42,51,.35)" stroke-width="1" visibility="hidden"/>`;
  charts.set(id, { ...model, W, L, pw, n, x });
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="推移グラフ">${g}</svg><div class="tip" hidden></div></div>`;
}

function chartPointer(el, clientX) {
  const m = charts.get(el.id);
  if (!m) return;
  const svg = el.querySelector('svg');
  const rect = svg.getBoundingClientRect();
  const vx = (clientX - rect.left) * m.W / rect.width;
  let best = 0, bd = Infinity;
  for (let i = 0; i < m.n; i++) { const dd = Math.abs(m.x(i) - vx); if (dd < bd) { bd = dd; best = i; } }
  const date = m.dates[best];
  const guide = document.getElementById(el.id + '-guide');
  const gx = m.x(best);
  guide.setAttribute('x1', gx); guide.setAttribute('x2', gx); guide.setAttribute('visibility', 'visible');
  const tip = el.querySelector('.tip');
  tip.innerHTML = `<b>${fmtMDW(date)}</b><br>` + m.series.map(s => {
    const v = s.values.get(date);
    return `<span class="k" style="background:${s.color}"></span>${esc(s.name)} ${v == null ? '記録なし' : fix1(v) + m.unit}`;
  }).join('<br>');
  tip.hidden = false;
  const px = gx * rect.width / m.W;
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(rect.width - tw, px - tw / 2)) + 'px';
}
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('.chart'); if (el && e.pointerType === 'mouse') chartPointer(el, e.clientX); });
document.addEventListener('pointerdown', e => {
  const el = e.target.closest && e.target.closest('.chart');
  for (const c of document.querySelectorAll('.chart')) if (c !== el) hideTip(c);
  if (el) chartPointer(el, e.clientX);
});
document.addEventListener('pointerleave', e => { if (e.target.classList && e.target.classList.contains('chart')) hideTip(e.target); }, true);
function hideTip(c) { const t = c.querySelector('.tip'); if (t) t.hidden = true; const g = c.querySelector('line[id$="-guide"]'); if (g) g.setAttribute('visibility', 'hidden'); }

function legendHtml(extra) {
  return `<div class="legend">${PEOPLE.map(p => `<span style="color:${T.people[p].main}"><i style="background:${T.people[p].main}"></i>${T.people[p].name}</span>`).join('')}${extra || ''}</div>`;
}
function periodSeg() {
  const opts = [[7, '7日'], [30, '30日'], [90, '90日'], ['all', '全期間']];
  return `<div class="seg" role="tablist">${opts.map(([v, l]) => `<button data-act="period" data-v="${v}" class="${S.period === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}
async function ensurePeriodData() {
  if (S.period === 'all' && !S.allLoaded) {
    try { await loadAll(); render(); } catch (e) { toast(e.message); }
  }
}
function seriesFor(p, getter, dates) {
  const values = new Map();
  for (const d of dates) { const r = S.logs.get(d); const v = r ? getter(r[p]) : null; if (v != null && Number.isFinite(v)) values.set(d, v); }
  return { key: p, name: T.people[p].name, color: T.people[p].main, values };
}

function renderWeight(main) {

  const loadingAll = S.period === 'all' && !S.allLoaded;
  // 再描画（自動更新など）でリストのスクロール位置が戻らないよう覚えておく
  const key = `${S.period}:${f}`;
  const prevBody = $('#wlBody');
  const keep = prevBody && wl.key === key ? { shown: wl.shown, top: prevBody.scrollTop } : null;
  main.innerHTML = `
    <div class="toolbar">${periodSeg()}
      <div class="seg"><button data-act="metric" data-v="weight" class="${f === 'weight' ? 'on' : ''}">体重</button><button data-act="metric" data-v="fat" class="${f === 'fat' ? 'on' : ''}">体脂肪率</button></div>
    </div>
    <div class="card chart-card">${legendHtml()}${loadingAll ? '<div class="loading">全期間を読み込み中…</div>' : chartHtml({ dates, series, unit, kind: 'line' })}</div>
    <div class="sum">${series.map(s => weightSummary(s, dates, unit)).join('')}</div>
    <div class="card wlist" id="wlist">
      <div class="wl-head"><span>日付</span>${PEOPLE.map(p => `<span style="color:${T.people[p].main}">${T.people[p].name}（${unit}）</span>`).join('')}</div>
      <div class="wl-body" id="wlBody">${loadingAll ? '<div class="wl-empty">読み込み中…</div>' : ''}</div>
    </div>`;
  if (!loadingAll) {
    // 選択中の期間で、どちらかに記録がある日（新しい順）
    const rows = dates.filter(d => series.some(s => s.values.has(d))).reverse()
      .map(d => ({ date: d, kenta: series[0].values.get(d), saori: series[1].values.get(d) }));
    setupWeightList(rows, key, keep);
  }
  sizeWeightList();
  ensurePeriodData();
}

// 体重タブの記録一覧：最初は 30 件、下までスクロールするか「もっと見る」で続きを表示
const WL_PAGE = 30;
let wl = { rows: [], shown: 0, key: null };
function setupWeightList(rows, key, keep) {
  wl = { rows, shown: 0, key };
  const body = $('#wlBody');
  if (!rows.length) { body.innerHTML = '<div class="wl-empty">この期間の記録はまだありません</div>'; return; }
  appendWeightRows();
  while (keep && wl.shown < Math.min(keep.shown, rows.length)) appendWeightRows();
  if (keep) requestAnimationFrame(() => { body.scrollTop = keep.top; });
  body.addEventListener('scroll', () => {
    if (body.scrollTop + body.clientHeight > body.scrollHeight - 80) appendWeightRows();
  }, { passive: true });
}
function appendWeightRows() {
  const body = $('#wlBody');
  if (!body || wl.shown >= wl.rows.length) return;
  const cell = v => (v == null ? '<span class="none">—</span>' : `<span>${fix1(v)}</span>`);
  const next = wl.rows.slice(wl.shown, wl.shown + WL_PAGE);
  const more = $('#wlMore');
  if (more) more.remove();
  body.insertAdjacentHTML('beforeend', next.map(r => `<div class="wl-row"><span>${fmtMDW(r.date)}</span>${cell(r.kenta)}${cell(r.saori)}</div>`).join(''));
  wl.shown += next.length;
  const rest = wl.rows.length - wl.shown;
  if (rest > 0) body.insertAdjacentHTML('beforeend', `<button class="wl-more" id="wlMore" data-act="wl-more">もっと見る（残り ${rest} 件）</button>`);
}
// 画面の残りの高さいっぱいに広げる（狭い画面では最低 260px）
function sizeWeightList() {
  const el = $('#wlist');
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY;
  const navH = $('#nav').offsetHeight;
  el.style.height = Math.max(260, window.innerHeight - navH - top - 16) + 'px';
}
window.addEventListener('resize', () => { if (S.tab === 'weight') sizeWeightList(); });
function weightSummary(s, dates, unit) {
  const vals = dates.filter(d => s.values.has(d)).map(d => s.values.get(d));
  const latest = vals.length ? vals[vals.length - 1] : null;
  const delta = vals.length > 1 ? Math.round((latest - vals[0]) * 10) / 10 : null;
  const sign = delta == null ? '' : delta > 0 ? '+' : delta < 0 ? '−' : '±';
  return `<div class="sum-card ${s.key}">
    <h3>${esc(s.name)}</h3>
    <div class="big">${fix1(latest)}<small>${unit}</small></div>
    <dl>
      <dt>期間内の増減</dt><dd>${delta == null ? '–' : sign + fix1(Math.abs(delta)) + unit}</dd>
      <dt>最小</dt><dd>${vals.length ? fix1(Math.min(...vals)) + unit : '–'}</dd>
      <dt>最大</dt><dd>${vals.length ? fix1(Math.max(...vals)) + unit : '–'}</dd>
    </dl></div>`;
}

// ---------------------------------------------------------------------------
// 睡眠タブ
// ---------------------------------------------------------------------------
function renderSleep(main) {
  const dates = periodDates(S.period);
  const series = PEOPLE.map(p => seriesFor(p, v => sleepNum(v.sleep), dates));
  const last7 = periodDates(7);
  const recent = PEOPLE.map(p => seriesFor(p, v => sleepNum(v.sleep), last7));
  const goals = [];
  for (let h = 5; h <= 9; h += 0.5) goals.push(h);
  const loadingAll = S.period === 'all' && !S.allLoaded;
  main.innerHTML = `
    <div class="toolbar">${periodSeg()}
      <label class="goal-set">目標 <select id="goalSel">${goals.map(h => `<option value="${h}" ${h === S.sleepGoal ? 'selected' : ''}>${h}h</option>`).join('')}</select></label>
    </div>
    <div class="card chart-card">${legendHtml('<span class="goal" style="color:var(--ink-soft)"><i></i>目標</span>')}
      ${loadingAll ? '<div class="loading">全期間を読み込み中…</div>' : chartHtml({ dates, series, unit: 'h', kind: dates.length <= 31 ? 'bar' : 'line', goal: S.sleepGoal, fixedMin: 4 })}</div>
    <div class="sum">${series.map((s, i) => sleepSummary(s, recent[i], dates)).join('')}</div>`;
  ensurePeriodData();
}
function avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function sleepSummary(s, recent, dates) {
  const vals = dates.filter(d => s.values.has(d)).map(d => s.values.get(d));
  const r7 = [...recent.values.values()];
  return `<div class="sum-card ${s.key}">
    <h3>${esc(s.name)}</h3>
    <div class="big">${fix1(avg(r7))}<small>h（直近7日平均）</small></div>
    <dl>
      <dt>期間平均</dt><dd>${vals.length ? fix1(avg(vals)) + 'h' : '–'}</dd>
      <dt>最長</dt><dd>${vals.length ? fix1(Math.max(...vals)) + 'h' : '–'}</dd>
      <dt>最短</dt><dd>${vals.length ? fix1(Math.min(...vals)) + 'h' : '–'}</dd>
    </dl></div>`;
}

// ---------------------------------------------------------------------------
// AYAトレタブ（aya100 毎日トラッカー）
// ---------------------------------------------------------------------------
let ayaBusy = false;
let ayaMsg = { day: null, text: '', err: false };

function ayaStats(a) {
  const t = today();
  const dates = a.checkedDates;
  const set = new Set(dates);
  let streak = 0;
  let d = set.has(t) ? t : addDays(t, -1);
  while (set.has(d)) { streak++; d = addDays(d, -1); }
  return { streak, total: dates.length, elapsed: diffDays(a.startDate, t) + 1 };
}

function linkForm(day, label) {
  const msg = ayaMsg.day === day ? `<div class="hint ${ayaMsg.err ? 'err' : ''}">${esc(ayaMsg.text)}</div>` : '';
  return `<form class="link-form" data-day="${day}"><input type="url" name="url" placeholder="https://youtu.be/…" inputmode="url" autocomplete="off" aria-label="DAY${day}の動画リンク">
    <button class="btn btn-aya" type="submit">${label}</button></form>${msg}`;
}

function renderAya(main) {
  const a = S.aya;
  if (!a) { main.innerHTML = `<div class="loading">${S.error ? esc(S.error) : '読み込み中…'}</div>`; return; }
  const t = today();
  const done = a.checkedDates.length;
  const current = done + 1;
  const todayDone = a.checkedDates.includes(t);
  const st = ayaStats(a);
  const link = a.links[current];
  let hero;
  if (todayDone) {
    hero = `<div class="label">今日のぶんはクリア！</div>
      <div class="day done tnum"><small>DAY</small>${done}</div>
      <div class="sub">${done}日分クリア ・ 次は DAY${current}（明日）</div>
      <div class="aya-actions">${a.links[done] ? `<a class="btn btn-light" href="${esc(a.links[done])}" target="_blank" rel="noopener">DAY${done}の動画をもう一度開く</a>` : ''}</div>
      ${link ? '' : `<div class="hint" style="margin-top:14px">DAY${current} のリンクが未登録です。先に登録しておけます。</div>${linkForm(current, '登録')}`}`;
  } else {
    hero = `<div class="label">今日見る動画</div>
      <div class="day tnum"><small>DAY</small>${current}</div>
      <div class="sub">${done}日分クリア</div>
      <div class="aya-actions">
        ${link ? `<a class="btn btn-aya" href="${esc(link)}" target="_blank" rel="noopener">▶ DAY${current}の動画を開く</a>` : ''}
        <button class="btn btn-check" data-act="aya-check" ${ayaBusy || !S.online ? 'disabled' : ''}>${ayaBusy ? '記録中…' : `見た！DAY${current}をチェック`}</button>
      </div>
      ${link ? '' : `<div class="hint" style="margin-top:14px">DAY${current} の動画リンクが未登録です。YouTube のリンクを貼り付けてください。</div>${linkForm(current, '登録')}`}
      ${link && !a.links[current + 1] ? `<details class="next-link"><summary>次の DAY${current + 1} のリンクを先に登録する</summary>${linkForm(current + 1, '登録')}</details>` : ''}`;
  }
  const pending = (a.pendingFromTaskDock || []).filter(d => d <= t);
  const items = [];
  for (let n = current; n >= 1; n--) {
    const date = a.checkedDates[n - 1];
    const isCur = n === current;
    const l = a.links[n];
    items.push(`<li class="${isCur ? 'current' : ''}">
      <span class="mark ${date ? 'done' : ''}">${date ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' : ''}</span>
      <span class="dn">DAY${n}</span>
      <span class="dd tnum">${date ? fmtMDW(date) + ' 実施' : isCur ? (todayDone ? '明日見る' : '今日見る') : ''}
        ${n === done && date ? ` <button class="undo" data-act="aya-undo" data-date="${date}">取り消す</button>` : ''}</span>
      ${l ? `<a class="vid" href="${esc(l)}" target="_blank" rel="noopener">▶ 動画</a>` : '<span class="vid none">リンク未登録</span>'}
    </li>`);
  }
  main.innerHTML = `
    ${pending.length ? `<div class="banner offline" style="margin:0 0 12px">TaskDock で記録された実施日（${pending.map(fmtMD).join('・')}）が、まだ習慣ログ一覧にチェックされていません。<button class="act" data-act="aya-import">取り込む</button></div>` : ''}
    <div class="card aya-hero">${hero}</div>
    <div class="stats">
      <div class="stat"><div class="v">${st.streak}<small>日</small></div><div class="k">連続</div></div>
      <div class="stat"><div class="v">${st.total}<small>日</small></div><div class="k">累計</div></div>
      <div class="stat"><div class="v">${st.elapsed}<small>日目</small></div><div class="k">開始 ${fmtMD(a.startDate)} から</div></div>
    </div>
    <div class="section-title">記録</div>
    <div class="card"><ul class="aya-list">${items.join('')}</ul></div>`;
}

async function ayaAction(fn, okMsg) {
  if (ayaBusy) return;
  if (!S.online) { toast('オフラインのため記録できません'); return; }
  ayaBusy = true;
  render();
  try {
    const state = await fn();
    S.aya = { ...S.aya, ...state };
    saveCache();
    if (okMsg) toast(okMsg);
    loadRecent().then(() => { saveCache(); if (S.tab === 'record') updateFoot(); }).catch(() => {});
  } catch (e) {
    toast(e.message);
    loadAya(true).catch(() => {});
  } finally {
    ayaBusy = false;
    if (S.tab === 'aya') render();
  }
}

async function submitLink(form) {
  const day = Number(form.dataset.day);
  const url = form.url.value.trim();
  if (!/^https:\/\/\S+$/.test(url)) { ayaMsg = { day, text: 'https:// から始まる URL を貼り付けてください', err: true }; render(); return; }
  if (!S.online) { toast('オフラインのため登録できません'); return; }
  form.querySelector('button').disabled = true;
  try {
    S.aya = { ...S.aya, ...(await api('PUT', `/api/aya/links/${day}`, { url })) };
    ayaMsg = { day: null, text: '', err: false };
    saveCache();
    toast(`DAY${day} のリンクを登録しました`);
  } catch (e) {
    ayaMsg = { day, text: e.message, err: true };
  }
  render();
}

// ---------------------------------------------------------------------------
// イベント
// ---------------------------------------------------------------------------
document.addEventListener('click', e => {
  const nav = e.target.closest('.nav button');
  if (nav) return setTab(nav.dataset.tab);
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'retry-load') refresh({ force: true });
  else if (act === 'prev-day') changeDate(addDays(S.date, -1));
  else if (act === 'next-day') changeDate(addDays(S.date, 1));
  else if (act === 'go-today') changeDate(today());
  else if (act === 'sleep') {
    const p = el.dataset.p;
    const v = el.dataset.v;
    S.draft[p].sleep = S.draft[p].sleep === v ? null : v; // もう一度押すと解除
    S.dirty[p].add('sleep');
    S.save[p] = 'dirty';
    for (const b of document.querySelectorAll(`.sleep-grid button[data-p="${p}"]`)) {
      const on = b.dataset.v === S.draft[p].sleep;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
    }
    updateStatus(p);
    scheduleSave(p, 500);
  } else if (act === 'save-all') {
    if (!S.online) { toast('オフラインのため保存できません'); return; }
    let any = false;
    for (const p of PEOPLE) {
      if (!S.dirty[p].size) continue;
      any = true;
      const warns = ['weight', 'fat'].filter(f => S.dirty[p].has(f) && fieldWarn(f, S.draft[p][f]));
      if (warns.some(f => Number.isNaN(parseNum(S.draft[p][f])))) { toast(`${T.people[p].name}：数値で入力してください`); continue; }
      if (warns.length && !confirm(`${T.people[p].name}の${warns.map(f => f === 'weight' ? '体重' : '体脂肪率').join('・')}が通常の範囲外です。このまま保存しますか？`)) continue;
      clearTimeout(saveTimers[p]);
      saveNow(p, true);
    }
    if (!any) toast('変更はありません（保存済みです）');
  } else if (act === 'retry-save') saveNow(el.dataset.p, false);
  else if (act === 'goto-aya') setTab('aya');
  else if (act === 'towel') toggleTowel();
  else if (act === 'cal-prev') shiftCalMonth(-1);
  else if (act === 'cal-next') shiftCalMonth(1);
  else if (act === 'cal-day') {
    // タップした日の記録へ移動（入力欄が見えるよう上に戻る）
    if (el.dataset.date !== S.date) changeDate(el.dataset.date);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  else if (act === 'wl-more') appendWeightRows();
  else if (act === 'period') {
    S.period = el.dataset.v === 'all' ? 'all' : Number(el.dataset.v);
    lsSet('period', S.period);
    render();
  } else if (act === 'metric') { S.metric = el.dataset.v; render(); }
  else if (act === 'aya-check') {
    const day = S.aya.checkedDates.length + 1;
    ayaAction(() => api('POST', '/api/aya/check', { date: today() }), `DAY${day} をチェックしました！`);
  } else if (act === 'aya-undo') {
    const date = el.dataset.date;
    if (!confirm(`DAY${S.aya.checkedDates.length}（${fmtMDW(date)}）の実施記録を取り消しますか？`)) return;
    ayaAction(() => api('POST', '/api/aya/uncheck', { date }), '取り消しました');
  } else if (act === 'aya-import') {
    const dates = (S.aya.pendingFromTaskDock || []).filter(d => d <= today());
    ayaAction(() => api('POST', '/api/aya/import', { dates }), `${dates.length}日分を取り込みました`);
  }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('.link-form');
  if (!form) return;
  e.preventDefault();
  submitLink(form);
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'goalSel') return;
  if (!t.dataset || !t.dataset.f || !S.draft) return;
  const p = t.dataset.p, f = t.dataset.f;
  S.draft[p][f] = t.value;
  S.dirty[p].add(f);
  S.save[p] = 'dirty';
  clearTimeout(saveTimers[p]);
  updateStatus(p);
  setWarn(p, f);
});
// 入力欄からフォーカスが外れたら保存
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f && t.dataset.p && S.dirty[t.dataset.p].size) scheduleSave(t.dataset.p, 400);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f) e.target.blur();
});
document.addEventListener('change', e => {
  if (e.target.id === 'datePick' && e.target.value) changeDate(e.target.value);
  if (e.target.id === 'goalSel') { S.sleepGoal = Number(e.target.value); lsSet('sleepGoal', S.sleepGoal); render(); }
});

$('#refreshBtn').addEventListener('click', () => refresh({ force: true }));
window.addEventListener('online', () => { S.online = true; renderBanners(); refresh(); for (const p of PEOPLE) if (S.dirty[p].size) scheduleSave(p, 200); });
window.addEventListener('offline', () => { S.online = false; renderBanners(); if (S.tab === 'aya') render(); });
window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));
// 相手の記録を反映するため、画面に戻ったときと 1 分ごとに再取得
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh({ quiet: true });
  else flushSaves();
});
setInterval(() => { if (document.visibilityState === 'visible') refresh({ quiet: true }); }, 60_000);
// 日付が変わったら「今日」を更新
let lastToday = today();
setInterval(() => { const t = today(); if (t !== lastToday) { if (S.date === lastToday) changeDate(t); lastToday = t; } }, 30_000);
window.addEventListener('beforeunload', flushSaves);

if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});

setTab(location.hash.slice(1) || 'record');
renderBanners();
renderSync();
refresh();
</script>
</body>
</html>
